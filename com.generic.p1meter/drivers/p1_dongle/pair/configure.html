<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script type="text/javascript" src="/homey.js" data-origin="view"></script>
    <style>
        body { padding: 20px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .field { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #333; }
        input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .button { background-color: #007aff; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        .button:active { background-color: #005bb5; }
        .error { color: #d90000; font-size: 14px; margin-top: 15px; display: none; background: #ffe6e6; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="field">
        <label for="ip">IP Address</label>
        <input type="text" id="ip" placeholder="bijv. 192.168.8.224" autocomplete="off" />
    </div>

    <div class="field">
        <label for="interval">Polling Interval (seconden)</label>
        <input type="number" id="interval" value="10" />
    </div>

    <button id="save" class="button">Save</button>
    <div id="error-msg" class="error"></div>

    <script type="text/javascript">
        function onHomeyReady(Homey) {
            Homey.ready();

            document.getElementById('save').addEventListener('click', function() {
                var errorMsg = document.getElementById('error-msg');
                errorMsg.style.display = 'none';

                var ipInput = document.getElementById('ip').value.trim();
                var intervalInput = document.getElementById('interval').value.trim();

                if (!ipInput) {
                    errorMsg.innerText = 'Vul aub een geldig IP adres in.';
                    errorMsg.style.display = 'block';
                    return;
                }

                // Stuur de ingevulde data naar de 'save_config' handler in driver.js
                Homey.emit('save_config', { ip: ipInput, interval: intervalInput })
                    .then(function(deviceParams) {
                        // Driver heeft het goedgekeurd, maak het apparaat aan!
                        return Homey.createDevice(deviceParams);
                    })
                    .then(function() {
                        // Sluit het scherm af
                        return Homey.done();
                    })
                    .catch(function(err) {
                        // Toon foutmelding op het scherm als er iets misgaat
                        errorMsg.innerText = 'Fout: ' + (err.message || err);
                        errorMsg.style.display = 'block';
                    });
            });
        }
    </script>
</body>
</html>
