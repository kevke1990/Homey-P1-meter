<!DOCTYPE html>
<html>
<head>
  <!-- These scripts are required by Homey SDK for pairing views -->
  <script src="/homey.js" data-origin="core"></script>
</head>
<body>
  <style>
    /* Basic styling for the pairing view */
    .form-group {
      margin-bottom: 1em;
    }
    label {
      display: block;
      margin-bottom: 0.5em;
      font-weight: bold;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 0.5em;
      box-sizing: border-box;
    }
    .button {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 1em;
      border-radius: 5px;
    }
    .button:hover {
      background-color: #0056b3;
    }
    .error-message {
      color: red;
      margin-top: 1em;
      display: none;
    }
  </style>

  <h2>Configure P1 Dongle</h2>
  <p>Please enter the IP address of your Wi-Fi P1 Dongle (e.g., Chargee Sparky) on your local network.</p>

  <div class="form-group">
    <label for="ipAddress">IP Address</label>
    <input type="text" id="ipAddress" placeholder="e.g. 192.168.1.50" required />
  </div>

  <div class="form-group">
    <label for="pollInterval">Polling Interval (seconds)</label>
    <input type="number" id="pollInterval" value="10" min="1" required />
  </div>

  <button id="saveBtn" class="button">Save</button>
  <div id="errorMsg" class="error-message"></div>

  <script type="text/javascript">
    const saveBtn = document.getElementById('saveBtn');
    const ipAddressInput = document.getElementById('ipAddress');
    const pollIntervalInput = document.getElementById('pollInterval');
    const errorMsg = document.getElementById('errorMsg');

    saveBtn.addEventListener('click', function () {
      errorMsg.style.display = 'none';
      errorMsg.textContent = '';

      const ipAddress = ipAddressInput.value.trim();
      const pollInterval = parseInt(pollIntervalInput.value, 10);

      if (!ipAddress) {
        showError('Please enter an IP address.');
        return;
      }

      // Basic IP validation
      const ipRegex = /^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/;
      if (!ipRegex.test(ipAddress)) {
        showError('Please enter a valid IP address.');
        return;
      }

      if (isNaN(pollInterval) || pollInterval < 1) {
        showError('Please enter a valid polling interval (> 0).');
        return;
      }

      const deviceId = 'p1_' + ipAddress.replace(/\./g, '_');
      const device = {
        name: 'P1 Meter (' + ipAddress + ')',
        data: {
          id: deviceId
        },
        settings: {
          ipAddress: ipAddress,
          pollInterval: pollInterval
        }
      };

      // Create the device directly from the frontend payload
      Homey.createDevice(device, function (err, result) {
        if (err) {
          showError('Error creating device: ' + (err.message || err));
          return;
        }
        Homey.done();
      });
    });

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.style.display = 'block';
    }
  </script>
</body>
</html>
