<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script type="text/javascript" src="/homey.js" data-origin="view"></script>
    <style>
        body { padding: 20px; font-family: sans-serif; }
        input, button { width: 100%; padding: 12px; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; border-radius: 5px; }
        input { border: 1px solid #ccc; }
        button { background: #007aff; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <label>IP Adres Dongle</label>
    <input type="text" id="ip" placeholder="192.168.8.224" />

    <label>Polling Interval (sec)</label>
    <input type="number" id="interval" value="10" />

    <button id="save">Opslaan & Toevoegen</button>
    
    <!-- Hier komt de visuele feedback! -->
    <div id="status" style="margin-top:10px; font-weight:bold; font-size: 14px;"></div>

    <script type="text/javascript">
        function onHomeyReady(Homey) {
            Homey.ready();

            document.getElementById('save').addEventListener('click', async function() {
                var statusDiv = document.getElementById('status');
                
                // 1. Directe feedback op het scherm dat de knop werkt
                statusDiv.style.color = "blue";
                statusDiv.innerText = "Apparaat toevoegen aan Homey..."; 

                var ip = document.getElementById('ip').value.trim();
                var interval = document.getElementById('interval').value.trim();

                if (!ip) {
                    statusDiv.style.color = "red";
                    statusDiv.innerText = "Vul aub een IP-adres in.";
                    return;
                }

                // 2. We maken het apparaat lokaal op 
                var device = {
                    name: "P1 Meter (" + ip + ")",
                    data: { id: ip },
                    settings: { 
                        ip: ip, 
                        polling_interval: parseInt(interval, 10) || 10 
                    }
                };

                try {
                    // 3. We duwen hem direct de Homey in, zonder driver.js te vragen
                    await Homey.createDevice(device);
                    
                    statusDiv.style.color = "green";
                    statusDiv.innerText = "Succes! Scherm wordt gesloten...";
                    
                    setTimeout(function() {
                        Homey.done();
                    }, 1000);
                } catch (err) {
                    statusDiv.style.color = "red";
                    statusDiv.innerText = "Fout: " + err.message;
                }
            });
        }
    </script>
</body>
</html>
