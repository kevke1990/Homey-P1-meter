<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <script type="text/javascript" src="/homey.js" data-origin="widget"></script>
  <style>
    :root {
      --bg: #0b1119;
      --card: #121b26;
      --card2: #172332;
      --text: #f4f7fb;
      --muted: #8f9aaa;
      --line: rgba(255,255,255,.08);
      --blue: #2f8cff;
      --green: #76d52c;
      --orange: #ff8a18;
      --purple: #a66cff;
      --danger: #ff5f6d;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif; }
    body { min-height:100vh; }
    .app { padding:14px; }
    .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .title { font-size:20px; font-weight:750; letter-spacing:-.3px; }
    .status { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 10px rgba(118,213,44,.45); }
    .dot.off { background:var(--danger); box-shadow:none; }
    .card { background:linear-gradient(145deg,var(--card),#0f1822); border:1px solid var(--line); border-radius:var(--radius); padding:15px; margin-bottom:12px; box-shadow:0 8px 30px rgba(0,0,0,.16); }
    .section-title { font-size:14px; font-weight:700; margin-bottom:12px; }
    .hero { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .metric { background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.055); border-radius:14px; padding:12px; }
    .metric .label { color:var(--muted); font-size:11px; margin-bottom:6px; }
    .metric .value { font-size:23px; font-weight:750; letter-spacing:-.5px; }
    .metric .sub { color:var(--muted); font-size:11px; margin-top:3px; }
    .blue { color:var(--blue); } .green { color:var(--green); } .orange { color:var(--orange); } .purple { color:var(--purple); }
    .net { text-align:center; margin-top:12px; padding:12px; border-radius:14px; background:rgba(47,140,255,.08); border:1px solid rgba(47,140,255,.14); }
    .net .big { font-size:26px; font-weight:800; }
    .net small { color:var(--muted); }
    .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .small-card { padding:10px; min-width:0; }
    .small-card .label { font-size:10px; line-height:1.25; min-height:26px; }
    .small-card .value { font-size:16px; font-weight:750; margin-top:5px; }
    .small-card .sub { font-size:10px; color:var(--muted); margin-top:2px; }
    .chart-wrap { height:145px; width:100%; position:relative; }
    svg { width:100%; height:100%; overflow:visible; }
    .axis { stroke:rgba(255,255,255,.08); stroke-width:1; }
    .bar.bluebar { fill:var(--blue); } .bar.greenbar { fill:var(--green); } .bar.orangebar { fill:var(--orange); }
    .bar { rx:2; }
    .axis-label { fill:#707b8c; font-size:9px; }
    .legend { display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:10px; margin-top:8px; }
    .legend span { display:flex; align-items:center; gap:5px; }
    .swatch { width:7px; height:7px; border-radius:2px; }
    .summary { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .summary .item { background:rgba(255,255,255,.025); border-radius:12px; padding:10px; }
    .summary .label { color:var(--muted); font-size:10px; }
    .summary .value { font-size:15px; font-weight:750; margin-top:4px; }
    .foot { color:var(--muted); font-size:10px; text-align:center; padding:4px 0 10px; }
    .error { color:#ff8f99; background:rgba(255,95,109,.08); border:1px solid rgba(255,95,109,.2); }
    @media (max-width:420px) {
      .title { font-size:18px; }
      .metric .value { font-size:20px; }
      .grid3 { gap:6px; }
      .small-card .value { font-size:14px; }
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="title">Chargee Sparky P1 Meter</div>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Verbinden...</span></div>
  </div>

  <div id="content"></div>
  <div class="foot" id="updated">Laden...</div>
</div>

<script>
(function() {
  let HomeyRef;
  let lastData = null;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num = (v, d=2) => new Intl.NumberFormat('nl-NL',{minimumFractionDigits:d,maximumFractionDigits:d}).format(Number(v)||0);
  const integer = v => new Intl.NumberFormat('nl-NL',{maximumFractionDigits:0}).format(Number(v)||0);
  const euro = v => '€ ' + num(v,2);

  function maxOf(arr) {
    return Math.max(0.001, ...arr.map(x => Number(x.value)||0));
  }

  function bars(data, cls, unit, digits=1) {
    const W=600,H=150,L=8,R=8,T=8,B=25;
    const plotW=W-L-R, plotH=H-T-B;
    const max=maxOf(data);
    const gap=3;
    const bw=Math.max(2,(plotW-(data.length-1)*gap)/data.length);
    let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
    [0,.5,1].forEach(p=>{
      const y=T+plotH-(plotH*p);
      svg+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/>`;
    });
    data.forEach((p,i)=>{
      const v=Number(p.value)||0;
      const h=plotH*(v/max);
      const x=L+i*(bw+gap);
      const y=T+plotH-h;
      svg+=`<rect class="bar ${cls}" x="${x}" y="${y}" width="${bw}" height="${Math.max(1,h)}" rx="2">
        <title>${esc(p.label)}: ${num(v,digits)} ${unit}</title></rect>`;
    });
    const every=Math.max(1,Math.ceil(data.length/6));
    data.forEach((p,i)=>{
      if(i%every===0 || i===data.length-1){
        const x=L+i*(bw+gap)+bw/2;
        svg+=`<text class="axis-label" x="${x}" y="${H-7}" text-anchor="middle">${esc(p.label)}</text>`;
      }
    });
    svg+='</svg>';
    return svg;
  }

  function card(title, body) {
    return `<section class="card"><div class="section-title">${title}</div>${body}</section>`;
  }

  function render(d) {
    const settings = HomeyRef.getSettings ? HomeyRef.getSettings() : {};
    const importPrice = Number(settings.electricity_price ?? .30) || .30;
    const exportPrice = Number(settings.feedin_price ?? .15) || .15;
    const gasPrice = Number(settings.gas_price ?? 1.00) || 1.00;

    const net = d.live.netW;
    const netText = Math.abs(net) >= 1000 ? (Math.abs(net)/1000).toFixed(2).replace('.',',')+' kW' : integer(Math.abs(net))+' W';
    const direction = net > 20 ? 'U gebruikt stroom van het net' : net < -20 ? 'U levert stroom terug aan het net' : 'Uw netverbruik is vrijwel nul';

    document.getElementById('statusText').textContent = d.device.available ? 'Online · live' : 'Offline';
    document.getElementById('statusDot').classList.toggle('off', !d.device.available);

    const todayCost = d.today.importKwh * importPrice;
    const feedValue = d.today.exportKwh * exportPrice;
    const gasCost = d.today.gasM3 * gasPrice;

    document.getElementById('content').innerHTML = `
      ${card('Stroom nu', `
        <div class="hero">
          <div class="metric">
            <div class="label blue">⚡ VERBRUIK</div>
            <div class="value">${d.live.importW >= 1000 ? num(d.live.importW/1000,2)+' kW' : integer(d.live.importW)+' W'}</div>
            <div class="sub">Stroom die u nu uit het net haalt</div>
          </div>
          <div class="metric">
            <div class="label green">♻ TERUGLEVERING</div>
            <div class="value">${d.live.exportW >= 1000 ? num(d.live.exportW/1000,2)+' kW' : integer(d.live.exportW)+' W'}</div>
            <div class="sub">Stroom die u nu teruglevert</div>
          </div>
        </div>
        <div class="net">
          <div class="big ${net < -20 ? 'green' : 'blue'}">${netText}</div>
          <small>${direction}</small>
        </div>
      `)}

      ${card('Totaalstanden', `
        <div class="grid3">
          <div class="metric small-card"><div class="label blue">⚡ Verbruik totaal</div><div class="value">${num(d.live.totalImportKwh)}</div><div class="sub">kWh uit net</div></div>
          <div class="metric small-card"><div class="label green">♻ Teruggeleverd totaal</div><div class="value">${num(d.live.totalExportKwh)}</div><div class="sub">kWh naar net</div></div>
          <div class="metric small-card"><div class="label orange">🔥 Gas totaal</div><div class="value">${num(d.live.totalGasM3,1)}</div><div class="sub">m³ verbruikt</div></div>
        </div>
      `)}

      ${card('Vandaag', `
        <div class="grid3">
          <div class="metric small-card"><div class="label blue">⚡ Stroom verbruikt</div><div class="value">${num(d.today.importKwh)}</div><div class="sub">kWh · ${euro(todayCost)}</div></div>
          <div class="metric small-card"><div class="label green">♻ Stroom teruggeleverd</div><div class="value">${num(d.today.exportKwh)}</div><div class="sub">kWh · ${euro(feedValue)}</div></div>
          <div class="metric small-card"><div class="label orange">🔥 Gas verbruikt</div><div class="value">${num(d.today.gasM3,2)}</div><div class="sub">m³ · ${euro(gasCost)}</div></div>
        </div>
      `)}

      ${card('Stroomverbruik — afgelopen 24 uur', `
        <div class="chart-wrap">${bars(d.charts.import24,'bluebar','kWh',2)}</div>
        <div class="legend"><span><i class="swatch" style="background:var(--blue)"></i>Verbruik uit net</span></div>
      `)}

      ${card('Teruglevering — afgelopen 24 uur', `
        <div class="chart-wrap">${bars(d.charts.export24,'greenbar','kWh',2)}</div>
        <div class="legend"><span><i class="swatch" style="background:var(--green)"></i>Zonnepanelen → net</span></div>
      `)}

      ${card('Gasverbruik — afgelopen 24 uur', `
        <div class="chart-wrap">${bars(d.charts.gas24,'orangebar','m³',3)}</div>
        <div class="legend"><span><i class="swatch" style="background:var(--orange)"></i>Gasverbruik per uur</span></div>
      `)}

      ${card('Afgelopen 7 dagen', `
        <div class="summary">
          <div class="item"><div class="label blue">STROOM VERBRUIKT</div><div class="value">${num(d.charts.import7.reduce((a,b)=>a+b.value,0))} kWh</div></div>
          <div class="item"><div class="label green">TERUGGELEVERD</div><div class="value">${num(d.charts.export7.reduce((a,b)=>a+b.value,0))} kWh</div></div>
          <div class="item"><div class="label orange">GAS</div><div class="value">${num(d.charts.gas7.reduce((a,b)=>a+b.value,0),2)} m³</div></div>
          <div class="item"><div class="label purple">NETTO STROOM</div><div class="value">${num(d.charts.import7.reduce((a,b)=>a+b.value,0)-d.charts.export7.reduce((a,b)=>a+b.value,0))} kWh</div></div>
        </div>
      `)}

      ${card('Verbruik per dag', `
        <div class="chart-wrap">${bars(d.charts.import7,'bluebar','kWh',1)}</div>
        <div class="legend"><span><i class="swatch" style="background:var(--blue)"></i>Stroom verbruikt</span></div>
      `)}

      ${card('Teruglevering per dag', `
        <div class="chart-wrap">${bars(d.charts.export7,'greenbar','kWh',1)}</div>
        <div class="legend"><span><i class="swatch" style="background:var(--green)"></i>Zonnepanelen</span></div>
      `)}

      ${card('Gas per dag', `
        <div class="chart-wrap">${bars(d.charts.gas7,'orangebar','m³',2)}</div>
        <div class="legend"><span><i class="swatch" style="background:var(--orange)"></i>Gasverbruik</span></div>
      `)}
    `;

    document.getElementById('updated').textContent = 'Laatst bijgewerkt: ' + new Date(d.generatedAt).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }

  async function load() {
    try {
      const ids = HomeyRef.getDeviceIds();
      if (!ids || !ids.length) {
        document.getElementById('content').innerHTML = '<div class="card error">Selecteer in de widget-instellingen uw Chargee Sparky P1 Meter.</div>';
        HomeyRef.ready({height:820});
        return;
      }

      const data = await HomeyRef.api('GET', '/?deviceId=' + encodeURIComponent(ids[0]), {});
      lastData = data;
      render(data);
      HomeyRef.ready({height:820});
    } catch (err) {
      document.getElementById('content').innerHTML = '<div class="card error"><b>Kan de P1-meter niet laden.</b><br>' + esc(err.message || err) + '</div>';
      HomeyRef.ready({height:300});
    }
  }

  function onReady(Homey) {
    HomeyRef = Homey;
    Homey.ready({height:820});
    load();
    setInterval(load, 60000);
  }

  if (typeof Homey !== 'undefined') {
    onReady(Homey);
  }
})();
</script>
</body>
</html>
